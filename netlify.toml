[build]
# No compilar, solo servir archivos estáticos
command = ""
publish = "."

# Redirigir API requests al backend
[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = false

# Redirigir requests sin extensión al servidor (para SPA si es necesario)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
condition = "! req.headers.Accept || req.headers.Accept != \"application/json\" && !req.path.includes(\".\")"

# Headers para CORS
[[headers]]
for = "/api/*"
[headers.values]
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
Access-Control-Allow-Headers = "Content-Type"

# Cache headers para archivos estáticos
[[headers]]
for = "/*"
[headers.values]
Cache-Control = "public, max-age=3600"

[[headers]]
for = "/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000"

# Variables de entorno para Netlify
[context.production.environment]
API_URL = "https://tu-app.herokuapp.com"

[context.preview.environment]
API_URL = "https://preview-tu-app.herokuapp.com"

[context.development.environment]
API_URL = "http://localhost:5000"
