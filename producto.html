<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Producto | ReManga</title>


    <!-- =====================================================
         TIPOGRAFÍAS
         ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Orbitron:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         ICONOS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >


    <!-- =====================================================
         CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="static/style.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header id="header">


        <!-- LOGO -->

        <div class="logo">

            <a href="index.html">

                <img
                    src="static/isotipo sin fondo.png"
                    alt="Logo ReManga"
                >

            </a>

        </div>


        <!-- NAVEGACIÓN -->

        <nav>

            <ul>

                <li>

                    <a href="index.html">
                        Inicio
                    </a>

                </li>

                <li>

                    <a
                        href="catalogo.html"
                        class="active"
                    >
                        Catálogo
                    </a>

                </li>

                <li>

                    <a href="vender.html">
                        Vender
                    </a>

                </li>

            </ul>

        </nav>


        <!-- PARTE DERECHA -->

        <div class="header-right">


            <!-- BUSCADOR -->

            <div class="search-box">

                <input
                    type="text"
                    id="productSearch"
                    placeholder="Buscar manga..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="productSearchButton"
                    aria-label="Buscar"
                >

                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>

            </div>


            <!-- ICONOS -->

            <div class="header-icons">


                <!-- USUARIO -->

                <a
                    href="#"
                    aria-label="Mi cuenta"
                >

                    <i class="fa-regular fa-user"></i>

                </a>


                <!-- CARRITO -->

                <a
                    href="carrito.html"
                    class="cart-icon-container"
                    aria-label="Carrito"
                >

                    <i class="fa-solid fa-cart-shopping"></i>

                    <span
                        class="cart-counter"
                        id="cartCounter"
                    >
                        0
                    </span>

                </a>


            </div>

        </div>

    </header>



    <!-- =====================================================
         PRODUCTO
         ===================================================== -->

    <main class="product-page">


        <div class="product-container">


            <!-- VOLVER -->

            <a
                href="catalogo.html"
                class="back-catalog"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Volver al catálogo

            </a>



            <!-- =================================================
                 INFORMACIÓN PRINCIPAL
                 ================================================= -->

            <section
                class="product-detail"
                id="productDetail"
            >


                <!-- ================= IMAGEN ================= -->

                <div class="product-gallery">

                    <div class="product-main-image">


                        <!--
                            Esta imagen es solamente
                            un valor inicial.

                            JavaScript la reemplazará
                            por la imagen de la API.
                        -->

                        <img
                            id="productImage"
                            src="static/isotipo sin fondo.png"
                            alt="Portada del manga"
                        >


                        <!-- ESTADO -->

                        <span
                            class="product-state new"
                            id="productState"
                        >
                            NUEVO
                        </span>


                        <!-- FAVORITO -->

                        <button
                            class="product-favorite"
                            id="productFavorite"
                            type="button"
                            aria-label="Agregar a favoritos"
                        >

                            <i class="fa-regular fa-heart"></i>

                        </button>

                    </div>

                </div>

                ... (rest unchanged) ...

    <!-- JAVASCRIPT -->

    <script src="config.js"></script>
    <script src="static/script.js"></script>

</body>

</html>
