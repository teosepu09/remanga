<!-- 
GUÍA: Cómo actualizar tus archivos HTML para producción

Esto es un ejemplo de lo que debe incluir CADA archivo HTML
(index.html, catalogo.html, producto.html, carrito.html, vender.html, login.html)

Asegúrate de que el script.js siga estos cambios también.
-->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ReManga | Compra y Venta de Mangas</title>

    <!-- ======================== IMPORTANTE ======================== -->
    <!-- Configurar la URL del API según el ambiente -->
    <!-- En desarrollo: No necesitas este script, usa localhost -->
    <!-- En producción: Cambia esta URL por tu servidor -->
    <script>
        // Este script DEBE ir antes de incluir script.js
        // Define la URL del API que usarán todos los scripts
        
        // Detectar si estamos en desarrollo
        const isDev = window.location.hostname === 'localhost' || 
                      window.location.hostname === '127.0.0.1';
        
        // Definir URL del API
        window.REMANGA_API_URL = isDev 
            ? 'http://127.0.0.1:5000'           // Desarrollo
            : 'https://tu-app-heroku.herokuapp.com';  // Producción - CAMBIAR ESTO
    </script>
    <!-- ============================================================= -->

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Iconos -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="static/style.css">
</head>

<body>
    <!-- Contenido aquí -->
    
    <!-- Scripts (Al final del body) -->
    <!-- IMPORTANTE: script.js DEBE cargar después de definir window.REMANGA_API_URL -->
    <script src="static/script.js"></script>
    <script src="static/login.js"></script>
</body>

</html>

<!-- 
RESUMEN DE CAMBIOS NECESARIOS EN CADA HTML:

1. En el <head>, ANTES de cualquier script, agregar:
   <script>
       window.REMANGA_API_URL = 'https://tu-app.herokuapp.com'; // En producción
   </script>

2. Verificar que script.js usa: const API_URL = window.REMANGA_API_URL || ... ;

3. Si tienes rutas relativas de CSS, dejar como están:
   <link rel="stylesheet" href="static/style.css"> ✓ Correcto
   <link rel="stylesheet" href="/static/style.css"> ✗ Incorrecto

4. Las imágenes también funcionan igual:
   <img src="imagenes/logo.png"> ✓ Correcto (relativo)

NOTA: Los archivos HTML no necesitan cambios mayores, solo el script
en el <head> para definir la URL del API.
-->
