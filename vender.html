<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vender | ReManga</title>


    <!-- =====================================================
         TIPOGRAFÍAS
         ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Orbitron:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         ICONOS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >


    <!-- =====================================================
         CSS
         ===================================================== -->

    <link
        rel="stylesheet"
        href="static/style.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header id="header">


        <!-- LOGO -->

        <div class="logo">

            <a href="index.html">

                <img
                    src="static/isotipo sin fondo.png"
                    alt="Logo ReManga"
                >

            </a>

        </div>


        <!-- NAVEGACIÓN -->

        <nav>

        <ul>

            <li>
                <a href="index.html" >
                    Inicio
                </a>
            </li>

            <li>
                <a href="catalogo.html">
                    Catálogo
                </a>
            </li>

            <li>
                <a href="vender.html" class="active">
                    Vender
                </a>
            </li>

        </ul>

    </nav>


        <!-- PARTE DERECHA -->

        <div class="header-right">


            <!-- BUSCADOR -->

            <div class="search-box">

                <input
                    type="text"
                    id="sellSearch"
                    placeholder="Buscar manga..."
                >

                <button
                    type="button"
                    id="sellSearchButton"
                >

                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>

            </div>


            <!-- ICONOS -->

            <div class="header-icons">

                <a href="#" aria-label="Mi cuenta">

                    <i class="fa-regular fa-user"></i>

                </a>


                <a
                    href="carrito.html"
                    class="cart-icon-container"
                    aria-label="Carrito"
                >

                    <i class="fa-solid fa-cart-shopping"></i>

                    <span
                        class="cart-counter"
                        id="cartCounter"
                    >
                        0
                    </span>

                </a>

            </div>

        </div>

    </header>



    <!-- =====================================================
         CONTENIDO PRINCIPAL
         ===================================================== -->

    <main class="sell-page">


        <div class="sell-container">


            <!-- =================================================
                 ENCABEZADO
                 ================================================= -->

            <section class="sell-heading">

                <span>
                    REMANGA MARKETPLACE
                </span>

                <h1>
                    Vendé tu manga
                </h1>

                <p>
                    Publicá tus mangas usados y encontrá
                    compradores dentro de la comunidad.
                </p>

            </section>



            <!-- =================================================
                 FORMULARIO
                 ================================================= -->

            <form
                class="sell-form"
                id="sellForm"
            >

            ... (rest unchanged) ...

            </form>

        </div>

    </main>



    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

        <div class="footer-logo">

            <img
                src="static/isotipo sin fondo.png"
                alt="Logo ReManga"
            >

        </div>


        <div class="footer-links">

            <a href="index.html">
                Inicio
            </a>

            <a href="catalogo.html">
                Catálogo
            </a>

            <a href="vender.html">
                Vender
            </a>

        </div>


        <div class="footer-social">

            <i class="fa-brands fa-instagram"></i>

            <i class="fa-brands fa-facebook"></i>

            <i class="fa-brands fa-x-twitter"></i>

        </div>


        <p>
            © 2026 ReManga - Todos los derechos reservados.
        </p>

    </footer>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="config.js"></script>
    <script src="static/script.js"></script>

</body>

</html>
