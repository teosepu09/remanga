<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fondo | ReManga</title>
    <style>
        /* Reseteo básico para eliminar márgenes del navegador */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Evita que aparezcan barras de desplazamiento */
        }

        /* Contenedor del fondo ajustado a toda la pantalla */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        /* La magia para que la imagen cubra todo sin estirarse feo */
        .background img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Obliga a la imagen a cubrir todo el espacio */
            object-position: center; /* Centra la imagen en la pantalla */
        }
    </style>
</head>
<body>
    
    <!-- Contenedor del fondo -->
    <div class="background">
        <img src="static/fotologin.jpeg" alt="Fondo ReManga">
    </div>

    <!-- Se eliminaron los contenedores <main class="login-container"> y <div class="background-overlay"> 
         para dejar la imagen completamente limpia -->

</body>
</html>
